<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Científica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .calculator-card { max-width: 1000px; margin: 40px auto; }
    .result-box { min-height: 80px; font-size: 1.5rem; }
    .method-card { height: 100%; }
    .method-card code { font-size: .9rem; }
  </style>
</head>
<body>
  <div class="container calculator-card">
    <div class="card shadow">
      <div class="card-body p-4">
        <h1 class="text-center mb-2">Calculadora Científica</h1>
        <p class="text-center text-muted mb-4">
          Interface para todos os métodos de <code>CalculadoraCientifica</code>
        </p>

        <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

        <div class="card bg-light mb-4">
          <div class="card-body">
            <label for="resultado" class="form-label fw-bold">Resultado</label>
            <div id="resultado" class="form-control result-box d-flex align-items-center">
              —
            </div>
          </div>
        </div>

        <div class="row g-4">

          <!-- Operações básicas -->
          <div class="col-md-6">
            <div class="card method-card">
              <div class="card-header fw-bold">Operações básicas</div>
              <div class="card-body">
                <div class="mb-3">
                  <label for="aBasico" class="form-label">Valor A</label>
                  <input id="aBasico" type="number" step="any" class="form-control">
                </div>
                <div class="mb-3">
                  <label for="bBasico" class="form-label">Valor B</label>
                  <input id="bBasico" type="number" step="any" class="form-control">
                </div>
                <div class="d-grid gap-2 d-sm-flex">
                  <button class="btn btn-primary flex-fill" onclick="executar(() => CalculadoraCientifica.somar(num('aBasico'), num('bBasico')))">Somar</button>
                  <button class="btn btn-primary flex-fill" onclick="executar(() => CalculadoraCientifica.subtrair(num('aBasico'), num('bBasico')))">Subtrair</button>
                  <button class="btn btn-primary flex-fill" onclick="executar(() => CalculadoraCientifica.multiplicar(num('aBasico'), num('bBasico')))">Multiplicar</button>
                  <button class="btn btn-primary flex-fill" onclick="executar(() => CalculadoraCientifica.dividir(num('aBasico'), num('bBasico')))">Dividir</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Potência e raiz -->
          <div class="col-md-6">
            <div class="card method-card">
              <div class="card-header fw-bold">Potência e raiz quadrada</div>
              <div class="card-body">
                <div class="mb-3">
                  <label for="base" class="form-label">Base / número</label>
                  <input id="base" type="number" step="any" class="form-control">
                </div>
                <div class="mb-3">
                  <label for="expoente" class="form-label">Expoente</label>
                  <input id="expoente" type="number" step="any" class="form-control">
                </div>
                <div class="d-grid gap-2 d-sm-flex">
                  <button class="btn btn-success flex-fill" onclick="executar(() => CalculadoraCientifica.potencia(num('base'), num('expoente')))">Potência</button>
                  <button class="btn btn-success flex-fill" onclick="executar(() => CalculadoraCientifica.raizQuadrada(num('base')))">Raiz quadrada</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Fatorial -->
          <div class="col-md-6">
            <div class="card method-card">
              <div class="card-header fw-bold">Fatorial</div>
              <div class="card-body">
                <label for="fatorial" class="form-label">Número inteiro não negativo</label>
                <input id="fatorial" type="number" step="1" class="form-control mb-3">
                <button class="btn btn-warning w-100" onclick="executar(() => CalculadoraCientifica.fatorial(num('fatorial')))">
                  Calcular fatorial
                </button>
              </div>
            </div>
          </div>

          <!-- Trigonometria -->
          <div class="col-md-6">
            <div class="card method-card">
              <div class="card-header fw-bold">Trigonometria</div>
              <div class="card-body">
                <label for="graus" class="form-label">Ângulo em graus</label>
                <input id="graus" type="number" step="any" class="form-control mb-3">
                <div class="d-grid gap-2 d-sm-flex">
                  <button class="btn btn-info flex-fill" onclick="executar(() => CalculadoraCientifica.seno(num('graus')))">Seno</button>
                  <button class="btn btn-info flex-fill" onclick="executar(() => CalculadoraCientifica.cosseno(num('graus')))">Cosseno</button>
                  <button class="btn btn-info flex-fill" onclick="executar(() => CalculadoraCientifica.tangente(num('graus')))">Tangente</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Logaritmos -->
          <div class="col-md-6">
            <div class="card method-card">
              <div class="card-header fw-bold">Logaritmos</div>
              <div class="card-body">
                <div class="mb-3">
                  <label for="numeroLog" class="form-label">Número</label>
                  <input id="numeroLog" type="number" step="any" class="form-control">
                </div>
                <div class="mb-3">
                  <label for="baseLog" class="form-label">Base do logaritmo</label>
                  <input id="baseLog" type="number" step="any" value="10" class="form-control">
                </div>
                <div class="d-grid gap-2 d-sm-flex">
                  <button class="btn btn-secondary flex-fill" onclick="executar(() => CalculadoraCientifica.logaritmo(num('numeroLog'), num('baseLog')))">Logaritmo</button>
                  <button class="btn btn-secondary flex-fill" onclick="executar(() => CalculadoraCientifica.logaritmoNatural(num('numeroLog')))">Log natural (ln)</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Porcentagem -->
          <div class="col-md-6">
            <div class="card method-card">
              <div class="card-header fw-bold">Porcentagem</div>
              <div class="card-body">
                <div class="mb-3">
                  <label for="valor" class="form-label">Valor</label>
                  <input id="valor" type="number" step="any" class="form-control">
                </div>
                <div class="mb-3">
                  <label for="percentual" class="form-label">Percentual (%)</label>
                  <input id="percentual" type="number" step="any" class="form-control">
                </div>
                <button class="btn btn-dark w-100" onclick="executar(() => CalculadoraCientifica.porcentagem(num('valor'), num('percentual')))">
                  Calcular porcentagem
                </button>
              </div>
            </div>
          </div>

          <!-- Conversão -->
          <div class="col-12">
            <div class="card">
              <div class="card-header fw-bold">Conversão de graus para radianos</div>
              <div class="card-body">
                <div class="row g-3 align-items-end">
                  <div class="col-md-9">
                    <label for="grausRad" class="form-label">Graus</label>
                    <input id="grausRad" type="number" step="any" class="form-control">
                  </div>
                  <div class="col-md-3">
                    <button class="btn btn-outline-primary w-100" onclick="executar(() => CalculadoraCientifica._paraRadianos(num('grausRad')))">
                      Converter
                    </button>
                  </div>
                </div>
                <small class="text-muted d-block mt-2">
                  O método é interno no objeto original, mas foi disponibilizado aqui para fins didáticos.
                </small>
              </div>
            </div>
          </div>

        </div>

        <div class="text-center mt-4">
          <button class="btn btn-outline-secondary" onclick="limpar()">
            Limpar resultados e campos
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Código original fornecido pelo usuário.
    const CalculadoraCientifica = {
      somar(a, b) {
        return a + b;
      },

      subtrair(a, b) {
        return a - b;
      },

      multiplicar(a, b) {
        return a * b;
      },

      dividir(a, b) {
        if (b === 0) {
          throw new Error("Divisão por zero não é permitida.");
        }
        return a / b;
      },

      potencia(base, expoente) {
        return Math.pow(base, expoente);
      },

      raizQuadrada(a) {
        if (a < 0) {
          throw new Error("Não é possível calcular raiz quadrada de número negativo.");
        }
        return Math.sqrt(a);
      },

      fatorial(n) {
        if (n < 0 || !Number.isInteger(n)) {
          throw new Error("Fatorial requer um número inteiro não negativo.");
        }
        return n <= 1 ? 1 : n * this.fatorial(n - 1);
      },

      seno(graus) {
        return Math.sin(this._paraRadianos(graus));
      },

      cosseno(graus) {
        return Math.cos(this._paraRadianos(graus));
      },

      tangente(graus) {
        return Math.tan(this._paraRadianos(graus));
      },

      logaritmo(a, base = 10) {
        if (a <= 0) {
          throw new Error("Logaritmo requer um número maior que zero.");
        }
        return Math.log(a) / Math.log(base);
      },

      logaritmoNatural(a) {
        if (a <= 0) {
          throw new Error("Logaritmo natural requer um número maior que zero.");
        }
        return Math.log(a);
      },

      porcentagem(valor, percentual) {
        return (valor * percentual) / 100;
      },

      _paraRadianos(graus) {
        return (graus * Math.PI) / 180;
      },
    };

    function num(id) {
      const input = document.getElementById(id);
      const valor = Number(input.value);

      if (input.value.trim() === "" || Number.isNaN(valor)) {
        throw new Error("Informe um valor numérico válido.");
      }

      return valor;
    }

    function formatarResultado(valor) {
      if (typeof valor !== "number") return String(valor);
      if (!Number.isFinite(valor)) return String(valor);
      return Number.isInteger(valor)
        ? valor.toLocaleString("pt-BR")
        : valor.toLocaleString("pt-BR", {
            maximumFractionDigits: 12
          });
    }

    function executar(funcao) {
      const resultado = document.getElementById("resultado");
      const alerta = document.getElementById("alerta");

      try {
        const valor = funcao();
        resultado.textContent = formatarResultado(valor);
        alerta.classList.add("d-none");
        alerta.textContent = "";
      } catch (erro) {
        resultado.textContent = "Erro";
        alerta.textContent = erro.message;
        alerta.classList.remove("d-none");
      }
    }

    function limpar() {
      document.querySelectorAll("input").forEach(input => input.value = "");
      document.getElementById("baseLog").value = "10";
      document.getElementById("resultado").textContent = "—";
      document.getElementById("alerta").classList.add("d-none");
      document.getElementById("alerta").textContent = "";
    }
  </script>
</body>
</html>
